name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable PostgreSQL 16 for the database, API and tenant-isolation tests.
    # Throwaway test credentials only. Host port 55432 is required: the repo's test scripts refuse any other port.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formiva_test
          POSTGRES_PASSWORD: formiva_test_only
          POSTGRES_DB: formiva_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U formiva_test -d formiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://formiva_test:formiva_test_only@127.0.0.1:55432/formiva_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Rebuild test database and run SQL security checks
        run: |
          pnpm --filter @formiva/db run db:reset
          pnpm --filter @formiva/db run db:security-check

      - name: Unit Tests
        run: pnpm run test

      - name: Tenant isolation and security tests
        run: pnpm exec vitest run tests/security --no-file-parallelism

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm --filter @formiva/web exec playwright install --with-deps chromium

      - name: Web end-to-end and accessibility tests
        run: pnpm --filter @formiva/web run e2e

      - name: API smoke test
        run: pnpm --filter @formiva/api run smoke

      - name: Bash Syntax/Tests Check
        run: |
          find infra/scripts -name "*.sh" -exec bash -n {} +
          find tests -name "*.sh" -exec bash -n {} +

      - name: Validate Docker Compose
        env:
          DB_NAME: formiva_db
          DB_USER: formiva_user
          DB_PASSWORD: dummy_password
          AI_HMAC_SECRET: dummy_hmac
        run: |
          docker compose -f infra/vm1/docker-compose.yml config
          docker compose -f infra/vm2/docker-compose.yml config

      # This file is excluded because the disposable test database credentials above
      # would match the pattern on purpose.
      - name: Secret Scan
        run: |
          if git grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" -- . ':(exclude)infra/vm1/.env.example' ':(exclude)infra/vm2/.env.example' ':(exclude).github/workflows/ci.yml'; then
            echo "Potential secret detected." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Secret scan failed with git grep status $status." >&2
              exit "$status"
            fi
          fi

      - name: Verify Secret Scan Fails with External Secret
        run: |
          trap "rm -f /tmp/FAKE_SECRET.txt" EXIT
          printf '%s%s\n' 'API_KEY=supersecret' '1234567890' > /tmp/FAKE_SECRET.txt
          if grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" /tmp/FAKE_SECRET.txt; then
            echo "External secret successfully detected."
          else
            echo "Secret detection failed."
            exit 1
          fi

  # Reporting-only scans. They show findings in the run log but never turn the build red,
  # because they depend on third-party rule feeds. Make them blocking once findings are triaged.
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep (report only)
        continue-on-error: true
        run: |
          python3 -m pip install --user semgrep==1.181.0
          "$HOME/.local/bin/semgrep" scan --config p/ci --error

      - name: Trivy (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
