name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit Tests
        run: pnpm run test

      - name: Bash Syntax/Tests Check
        run: |
          find infra/scripts -name "*.sh" -exec bash -n {} +
          find tests -name "*.sh" -exec bash -n {} +

      - name: Validate Docker Compose
        env:
          # VM1 synthetic variables
          DB_NAME: formiva_db
          DB_USER: formiva_user
          DB_PASSWORD: dummy_password
          # VM2 synthetic variable
          AI_HMAC_SECRET: dummy_hmac_secret
        run: |
          docker compose -f infra/vm1/docker-compose.yml config
          docker compose -f infra/vm2/docker-compose.yml config

      - name: Secret Scan
        # Using precise grep -Ei pattern, scanning tracked files
        run: |
          ! git grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" -- .

      - name: Verify Secret Scan Fails with External Secret
        run: |
          trap "rm -f /tmp/FAKE_SECRET.txt" EXIT
          echo "API_KEY=supersecret1234567890" > /tmp/FAKE_SECRET.txt
          # Scan repo
          git grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" -- . || echo "Repo scan passed (no secrets)."
          # Scan external secret file explicitly
          if grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" /tmp/FAKE_SECRET.txt; then
            echo "External secret successfully detected."
          else
            echo "Secret detection failed."
            exit 1
          fi

      - name: Semgrep
        uses: semgrep/semgrep-action@v2.6.1
        with:
          generateSarif: "1"

      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
