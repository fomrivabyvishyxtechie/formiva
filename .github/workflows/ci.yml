name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit Tests
        run: pnpm run test

      - name: Bash Syntax/Tests Check
        run: |
          find infra/scripts -name "*.sh" -exec bash -n {} +
          find tests -name "*.sh" -exec bash -n {} +

      - name: Validate Docker Compose
        env:
          DB_NAME: formiva_db
          DB_USER: formiva_user
          DB_PASSWORD: dummy_password
          AI_HMAC_SECRET: dummy_hmac
        run: |
          docker compose -f infra/vm1/docker-compose.yml config
          docker compose -f infra/vm2/docker-compose.yml config

      - name: Secret Scan
        run: |
          if git grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" -- . ':(exclude)infra/vm1/.env.example' ':(exclude)infra/vm2/.env.example'; then
            echo "Potential secret detected." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Secret scan failed with git grep status $status." >&2
              exit "$status"
            fi
          fi

      - name: Verify Secret Scan Fails with External Secret
        run: |
          trap "rm -f /tmp/FAKE_SECRET.txt" EXIT
          printf '%s%s\n' 'API_KEY=supersecret' '1234567890' > /tmp/FAKE_SECRET.txt
          git grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" -- . ':(exclude)infra/vm1/.env.example' ':(exclude)infra/vm2/.env.example' || echo "Repo scan passed (no secrets)."
          if grep -Ei "(api_key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\"]?[a-zA-Z0-9_-]{16,}['\"]?" /tmp/FAKE_SECRET.txt; then
            echo "External secret successfully detected."
          else
            echo "Secret detection failed."
            exit 1
          fi

      - name: Semgrep
        # Using a reliable action reference; semgrep/semgrep-action@v1 is generally stable.
        uses: semgrep/semgrep-action@v1
        with:
          generateSarif: "1"

      - name: Trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
